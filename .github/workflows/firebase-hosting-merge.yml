name: Deploy to Firebase Hosting & Rules on merge

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build_and_deploy:
    name: Build & Deploy (Live)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Code Quality & Type Check
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Prepare & Sanitize Firebase Credentials
        env:
          SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MIMARICAM_7DBD6 }}
        run: |
          node -e "
          const fs = require('fs');
          let raw = process.env.SA_KEY;
          if (!raw) {
            console.error('Hata: FIREBASE_SERVICE_ACCOUNT_MIMARICAM_7DBD6 secret boş veya bulunamadı.');
            process.exit(1);
          }
          // Decode Base64 if secret was base64 encoded
          try {
            const decoded = Buffer.from(raw, 'base64').toString('utf8');
            if (decoded.includes('private_key')) raw = decoded;
          } catch (e) {}

          let parsed;
          try {
            parsed = JSON.parse(raw);
          } catch (e) {
            console.error('Hata: Service Account geçerli bir JSON objesi değil.');
            process.exit(1);
          }

          if (parsed.private_key) {
            // Fix OpenSSL 3.0 DECODER routines::unsupported error by converting literal '\n' to actual newlines
            parsed.private_key = parsed.private_key.replace(/\\\\n/g, '\n');
          }

          const targetPath = '/tmp/firebase-service-account.json';
          fs.writeFileSync(targetPath, JSON.stringify(parsed));
          console.log('Firebase Service Account anahtarı doğrulandı ve hazırlandı.');
          "
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-service-account.json" >> $GITHUB_ENV

      - name: Deploy to Firebase Hosting, Firestore Rules & Storage Rules
        run: |
          npx --yes firebase-tools deploy --only hosting,firestore:rules,storage --project ${{ secrets.FIREBASE_PROJECT_ID || 'mimaricam-7dbd6' }} --non-interactive
